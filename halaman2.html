<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Galeri Fotografi</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f8fafc;
}

nav{
    background:#1e293b;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
}

h1{
    text-align:center;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    width:280px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card p{
    padding:10px;
}
</style>
</head>

<body>

<nav>

</div>

<div class="card">

</div>

<div class="card">

</div>

</div>
